name: Spiritus macOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: futuro-macos-build
  cancel-in-progress: true

jobs:
  build-universal:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Confirm Apple Silicon build host
        run: |
          sw_vers
          uname -m
          test "$(uname -m)" = "arm64"
          xcode-select -p

      - name: Install CMake
        run: |
          brew install cmake
          cmake --version

      - name: Build universal VST3, AU, and unsigned test installer
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh

      - name: Run DSP regression tests
        run: |
          cmake --build build-macos --config Release --target FUTURO_DSP_SMOKE_TEST
          ./build-macos/FUTURO_DSP_SMOKE_TEST

      - name: Validate plug-ins with pluginval
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip" \
            --output pluginval.zip
          mkdir -p pluginval-dist
          ditto -x -k pluginval.zip pluginval-dist
          PLUGINVAL="$(find pluginval-dist -path '*/Contents/MacOS/pluginval' -type f -print -quit)"
          test -n "$PLUGINVAL"
          chmod +x "$PLUGINVAL"
          VST3="$(find build-macos -type d -name 'Spiritus Spring Reverb.vst3' -print -quit)"
          AU_BUILD="$(find build-macos -type d -name 'Spiritus Spring Reverb.component' -print -quit)"
          test -n "$VST3"
          test -n "$AU_BUILD"
          mkdir -p dist/pluginval-logs
          "$PLUGINVAL" --strictness-level 5 --skip-gui-tests --validate-in-process --output-dir dist/pluginval-logs --validate "$VST3"

          # Audio Units are registered by macOS from a standard Components folder.
          # A bundle in CMake's build tree cannot be discovered by AudioComponent APIs.
          AU_DIR="$HOME/Library/Audio/Plug-Ins/Components"
          AU="$AU_DIR/Spiritus Spring Reverb.component"
          mkdir -p "$AU_DIR"
          rm -rf "$AU"
          cp -R "$AU_BUILD" "$AU"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aufx Fspr Ftro
          "$PLUGINVAL" --strictness-level 5 --skip-gui-tests --validate-in-process --output-dir dist/pluginval-logs --validate "$AU"

      - name: Upload pluginval diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Spiritus-pluginval-diagnostics
          path: dist/pluginval-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify universal bundles and installer
        run: |
          test -d 'dist/pkgroot/Library/Audio/Plug-Ins/VST3/Spiritus Spring Reverb.vst3'
          test -d 'dist/pkgroot/Library/Audio/Plug-Ins/Components/Spiritus Spring Reverb.component'
          test -f 'dist/Spiritus-Spring-Reverb-0.12.1-universal.pkg'
          lipo 'dist/pkgroot/Library/Audio/Plug-Ins/VST3/Spiritus Spring Reverb.vst3/Contents/MacOS/Spiritus Spring Reverb' -verify_arch arm64 x86_64
          lipo 'dist/pkgroot/Library/Audio/Plug-Ins/Components/Spiritus Spring Reverb.component/Contents/MacOS/Spiritus Spring Reverb' -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 'dist/pkgroot/Library/Audio/Plug-Ins/VST3/Spiritus Spring Reverb.vst3'
          codesign --verify --deep --strict --verbose=2 'dist/pkgroot/Library/Audio/Plug-Ins/Components/Spiritus Spring Reverb.component'
          pkgutil --payload-files 'dist/Spiritus-Spring-Reverb-0.12.1-universal.pkg' | grep -E 'Audio/Plug-Ins/(VST3|Components)/Spiritus Spring Reverb' >/dev/null

      - name: Archive plug-ins and checksums
        run: |
          mkdir -p dist/artifacts
          ditto -c -k --sequesterRsrc --keepParent 'dist/pkgroot/Library/Audio/Plug-Ins/VST3/Spiritus Spring Reverb.vst3' 'dist/artifacts/Spiritus-Spring-Reverb-VST3-v0.12.1-universal.zip'
          ditto -c -k --sequesterRsrc --keepParent 'dist/pkgroot/Library/Audio/Plug-Ins/Components/Spiritus Spring Reverb.component' 'dist/artifacts/Spiritus-Spring-Reverb-AU-v0.12.1-universal.zip'
          cp 'dist/Spiritus-Spring-Reverb-0.12.1-universal.pkg' dist/artifacts/
          cd dist/artifacts
          shasum -a 256 ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spiritus-Spring-Reverb-macOS-v0.12.1-universal
          path: dist/artifacts/*
          if-no-files-found: error
          retention-days: 30
