name: macOS DSP regression

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "improve/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dsp-smoke:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode toolchain
        run: |
          xcode-select -p
          cmake --version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build AU, VST3, and DSP regression targets
        run: cmake --build build --config Release --target FUTURO_SPRING_AU FUTURO_SPRING_VST3 FUTURO_DSP_SMOKE_TEST --parallel 2

      - name: Run DSP regression tests
        run: ./build/FUTURO_DSP_SMOKE_TEST
